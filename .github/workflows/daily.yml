name: Daily PSX refresh

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 5pm PKT, after market close, Mon-Fri
  workflow_dispatch:          # lets you run it manually

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/umairsandhu/psx-dps
      - run: python fetch_psx.py
      - name: Commit changes
        run: |
          git config user.name "psx-bot"
          git config user.email "psx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daily PSX update $(date -u +%F)" && git push)
